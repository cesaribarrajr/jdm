version: '3.8'

services:
  app:
    build: .
    # IMPORTANT: Replace XXXX with your assigned port number from the email
    ports:
      - "43933:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/jdmregistry
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
